name: matths
app: node@24
options:
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8000"
    - name: APP_BASE_URL
      value: https://www.matths.kr
    - name: PUBLIC_BASE_URL
      value: https://www.matths.kr
    - name: GOOGLE_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/google/callback
    - name: KAKAO_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/kakao/callback
    - name: CANONICAL_REDIRECT_SOURCE_HOST
      value: matths.kr
    - name: CANONICAL_HOST
      value: www.matths.kr
    # 네이티브는 Bundle ID, 웹은 Services ID를 client_id로 사용한다.
    # Team/Key ID와 PRIVATE KEY는 코드 교환·계정 탈퇴 토큰 폐기에 쓰며,
    # PRIVATE KEY는 Cloudtype 시크릿으로만 둔다.
    - name: APPLE_BUNDLE_ID
      value: kr.matths.app
    - name: APPLE_SERVICES_ID
      value: kr.matths.web
    - name: APPLE_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/apple/callback
    - name: APPLE_ALLOW_SANDBOX
      value: "true"
    - name: APPLE_TEAM_ID
      value: 64U874RU4D
    - name: APPLE_KEY_ID
      value: 9QKK29V5FQ
    - name: FINANCE_APPLE_FEE_RESERVE_BPS
      value: "3000"
    # KG이니시 계약 심사 기간에는 공식 공용 TEST 상점으로 결제창을 노출한다.
    # 서버의 계정 allowlist가 아래 심사 계정 외 TEST 주문 생성을 차단한다.
    - name: PAID_CHECKOUT_ENABLED
      value: "true"
    - name: PAYMENT_PROVIDER
      value: INICIS
    - name: INICIS_PAYMENTS_MODE
      value: TEST
    - name: INICIS_TEST_REVIEW_EMAILS
      value: kginicis@test.com
    - name: INICIS_TEST_MID
      value: INIpayTest
    - name: INICIS_TEST_HASH_KEY
      value: 3CB8183A4BE283555ACC8363C0360223
    - name: INICIS_TEST_API_KEY
      value: ItEQKi3rY7uvDS8l
    # KG이니시 공식 TEST 샘플의 clientIp 값이다. 운영 MID 전환 시 실제 서버 IP로 교체한다.
    - name: INICIS_TEST_CLIENT_IP
      value: 127.0.0.1
  # Cloudtype가 이전 빌드의 손상된 node_modules를 재사용하더라도
  # npm ci가 항상 깨끗한 의존성 트리에서 시작하도록 한다.
  install: rm -rf node_modules && npm ci --omit=dev --no-audit
  ports: 8000/http
  start: npm start

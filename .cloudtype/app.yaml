name: matths
app: node@24
options:
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8000"
    - name: APP_BASE_URL
      value: https://www.matths.kr
    - name: PUBLIC_BASE_URL
      value: https://www.matths.kr
    - name: GOOGLE_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/google/callback
    - name: KAKAO_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/kakao/callback
    - name: CANONICAL_REDIRECT_SOURCE_HOST
      value: matths.kr
    - name: CANONICAL_HOST
      value: www.matths.kr
    # 네이티브는 Bundle ID, 웹은 Services ID를 client_id로 사용한다.
    # Team/Key ID와 PRIVATE KEY는 코드 교환·계정 탈퇴 토큰 폐기에 쓰며,
    # PRIVATE KEY는 Cloudtype 시크릿으로만 둔다.
    - name: APPLE_BUNDLE_ID
      value: kr.matths.app
    - name: APPLE_SERVICES_ID
      value: kr.matths.web
    - name: APPLE_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/apple/callback
    - name: APPLE_ALLOW_SANDBOX
      value: "true"
    - name: APPLE_TEAM_ID
      value: 64U874RU4D
    - name: APPLE_KEY_ID
      value: 9QKK29V5FQ
    - name: FINANCE_APPLE_FEE_RESERVE_BPS
      value: "3000"
  # Cloudtype가 이전 빌드의 손상된 node_modules를 재사용하더라도
  # npm ci가 항상 깨끗한 의존성 트리에서 시작하도록 한다.
  install: rm -rf node_modules && npm ci --omit=dev --no-audit
  ports: 8000/http
  start: npm start

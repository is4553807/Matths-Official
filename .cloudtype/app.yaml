name: matths
app: node@24
options:
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8000"
    - name: APP_BASE_URL
      value: https://www.matths.kr
    - name: PUBLIC_BASE_URL
      value: https://www.matths.kr
    - name: GOOGLE_OAUTH_REDIRECT_URI
      value: https://www.matths.kr/auth/google/callback
    - name: CANONICAL_REDIRECT_SOURCE_HOST
      value: matths.kr
    - name: CANONICAL_HOST
      value: www.matths.kr
  install: npm ci --omit=dev --no-audit
  ports: 8000/http
  start: npm start

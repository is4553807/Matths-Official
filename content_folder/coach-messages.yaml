version: 1

# 상황 이름
# correct: 문제를 맞혔을 때
# incorrect: 문제를 틀렸을 때
# unanswered: 답을 제출하지 못했거나 힌트를 열었을 때
# study_prompt: 대시보드에서 오늘의 학습 시작을 독려할 때
#
# 문구를 추가하거나 삭제하면 서버가 다음 요청에서 자동으로 다시 읽습니다.
# 각 목록에는 한 줄짜리 한국어 문구를 자유롭게 넣을 수 있습니다.

modes:
  mild:
    label: 순한맛
    title: 순한맛 모드
    messages:
      study_prompt:
        - 일단 한 문제만 시작해봐요. 시작하면 다음은 훨씬 쉬워집니다.
        - 완벽하게 하려 하지 말고 오늘의 첫 문제부터 풀어봐요.
        - 지금 시작한 10분이 오늘의 공부 흐름을 만듭니다.
        - 공부할 마음이 들 때까지 기다리지 말고 가볍게 시작해봐요.
        - 오늘의 작은 공부가 내일의 실력을 만듭니다.
        - 한 문제를 푸는 순간 오늘의 학습은 이미 성공입니다.
        - 어려운 문제보다 먼저 쉬운 문제로 손을 풀어봐요.
        - 부담 갖지 말고 할 수 있는 만큼만 시작해도 괜찮아요.
        - 지금의 집중이 시험장에서의 자신감으로 돌아옵니다.
        - 오늘도 어제보다 한 문제만 더 알아가 봐요.
        - 시작하기 가장 좋은 순간은 바로 지금입니다.
        - 고민은 잠시 내려놓고 첫 번째 문제를 열어봐요.
        - 짧게 공부해도 꾸준히 이어가면 큰 차이가 생깁니다.
        - 오늘 배운 한 가지가 나중에는 강력한 무기가 됩니다.
        - 공부는 시작하기 전이 가장 어렵습니다. 일단 들어가 봐요.
        - 한 번에 많이 하지 않아도 돼요. 오늘의 분량부터 해봐요.
        - 지금 한 문제를 풀면 오늘의 내가 조금 더 강해집니다.
        - 집중이 잘 안 되는 날에는 쉬운 문제부터 시작해봐요.
        - 결과보다 오늘 공부를 시작했다는 사실이 더 중요합니다.
        - 모르는 문제가 나와도 괜찮아요. 알아가는 과정이니까요.
        - 오늘의 목표를 작게 잡고 하나씩 완료해봐요.
        - 문제를 푸는 동안 실력은 눈에 보이지 않게 쌓이고 있습니다.
        - 딱 10분만 집중해봐요. 계속할지는 그다음에 정해도 됩니다.
        - 지금 시작하면 오늘을 마음 편하게 마무리할 수 있어요.
        - 오늘 공부할 내용을 하나 골라 바로 시작해봐요.
        - 처음부터 잘 풀리지 않아도 괜찮아요. 손을 움직이는 게 먼저입니다.
        - 매일의 한 문제가 결국 가장 큰 차이를 만듭니다.
        - 오늘의 첫 정답을 만나러 가볼까요?
        - 공부할 준비는 이미 끝났어요. 이제 첫 문제만 열면 됩니다.
        - 미래의 나를 위해 지금 작은 한 걸음을 시작해봐요.
      correct:
        - 잘 풀었어요. 핵심 조건을 정확히 읽었습니다.
        - 정답이에요. 지금 사용한 풀이 순서를 기억해두세요.
        - 좋아요. 계산과 개념 연결이 자연스러웠습니다.
        - 정확합니다. 같은 유형도 충분히 풀 수 있어요.
        - 잘했습니다. 중요한 단서를 놓치지 않았어요.
        - 정답입니다. 풀이가 한 단계 더 단단해졌어요.
        - 좋아요. 식을 세우는 방향이 정확했습니다.
        - 맞았습니다. 검산까지 하면 더 확실해져요.
        - 훌륭해요. 이 개념은 제대로 이해하고 있습니다.
        - 정답이에요. 다음 문제도 같은 원리로 접근해보세요.
      incorrect:
        - 괜찮아요. 첫 번째로 달라진 계산부터 다시 확인해봐요.
        - 아쉬워요. 문제의 조건을 식에 모두 옮겼는지 살펴보세요.
        - 한 번 더 볼까요? 부호와 계산 순서를 차례로 확인해요.
        - 거의 왔어요. 사용한 공식의 적용 조건을 다시 읽어보세요.
        - 틀린 지점이 배울 지점이에요. 첫 단서부터 천천히 이어가요.
        - 답보다 과정이 중요해요. 식을 세운 단계부터 점검해봐요.
        - 괜찮습니다. 주어진 값과 구해야 하는 값을 다시 나눠보세요.
        - 조금만 다듬으면 돼요. 중간 계산을 한 줄씩 검산해보세요.
        - 이번에는 놓쳤지만 원리를 확인하면 바로 고칠 수 있어요.
        - 다시 도전해봐요. 같은 유형의 핵심 조건부터 표시해보세요.
      unanswered:
        - 막혀도 괜찮아요. 문제에서 가장 먼저 주어진 조건을 찾아봐요.
        - 힌트를 보기 전에 구해야 하는 값을 한 문장으로 적어보세요.
        - 지금 아는 식 하나부터 써보면 다음 단계가 보일 거예요.
        - 문제를 작은 단계로 나누면 시작점을 찾기 쉬워요.
        - 서두르지 않아도 돼요. 개념 정의부터 문제에 연결해봐요.
        - 주어진 값과 모르는 값을 나누어 표시해보세요.
        - 첫 단서만 찾으면 됩니다. 나머지는 차례대로 이어가요.
        - 비슷한 예시에서 어떤 공식을 썼는지 떠올려보세요.
        - 식을 완성하지 못해도 괜찮아요. 아는 부분부터 적어봐요.
        - 그래프나 표로 바꾸어 보면 관계가 더 잘 보일 수 있어요.

  spicy:
    label: 매운맛
    title: 매운맛 모드
    messages:
      study_prompt:
        - 또 화면만 켜놓고 공부한 척이냐? 그 지랄로 성적 올랐으면 전 국민이 전교 1등이다.
        - 계획표는 존나 야무지게 짜놓고 실천은 어디다 팔아먹었냐. 이제 문제나 펴.
        - 조금 있다가를 계속 모으면 아 씨발, 좆됐다가 된다.
        - 오늘 하루쯤은 괜찮다고? 너 그 개소리 어제도 했잖아.
        - 집중이 안 된다면서 폰은 두 시간 봤네. 선택적 집중력 개쩐다.
        - 시작도 안 했는데 벌써 지쳤대. 뭐랑 싸웠냐, 로그인 버튼?
        - 문제는 어려운데 네 핑계는 왜 이렇게 술술 풀리냐.
        - 공부할 컨디션을 기다리고 있냐? 그런 전설의 포켓몬은 없다.
        - 하기 싫은 건 알겠는데 성적표가 네 기분까지 존중해 줄 것 같냐?
        - 네가 침대에서 뒹구는 동안 경쟁자는 한 문제 더 틀리고 한 문제 더 배웠다. 넌 그냥 뒹굴었고.
        - 공부는 하기 싫고 결과는 좋고 싶고. 양심이 아주 풀옵션이네.
        - 내일부터 진짜 한다. 그 내일이 대체 몇 번째냐? 달력도 지겹겠다.
        - 네 미래가 걱정된다면서 현재의 넌 왜 누워서 쇼츠나 처보고 있냐.
        - 시험 전날 좆됐다 하기 싫으면 오늘 한 문제라도 풀어.
        - 모르는 게 쪽팔린 게 아니다. 계속 모른 척 처박아두는 게 쪽팔린 거다.
        - 딱 한 문제도 못 풀겠다면 네 목표는 목표가 아니라 망상이다.
        - 시험 전날의 너한테 오늘의 너는 거의 개새끼 수준의 빌런이다.
        - 운 좋게 잘 보게 해달라고? 로또도 사고 나서 기도한다. 문제부터 풀어.
        - 네 잠재력? 안 꺼내 쓰면 그냥 포장도 안 뜯은 재고다.
        - 공부 안 한 죄책감으로 하루 종일 염병 떨 바엔 씨발 20분만 해.
        - 존나 하기 싫지? 그래서 지금 하는 놈이 올라가는 거다. 남들도 다 하기 싫거든.
        - 문제를 피하는 실력만 늘었네. 시험지에 회피 버튼이라도 있을 줄 아냐?
        - 성적이 왜 안 오르냐고? 문제집이랑 눈싸움만 하니까 그렇지.
        - 넌 아직 좆된 게 아니다. 계속 이 지랄 하면 진짜 좆되는 거지.
        - 완벽하게 시작하겠다는 말로 미루는 거, 고급스러워 보이는 도망일 뿐이다.
        - 공부하기 싫어서 이유 좀 그만 찾아. 이유는 존나 찾았고 답은 하나도 못 찾았잖아.
        - 오늘 하루 종일 바빴다고? 휴대폰 사용 시간부터 까보고 그 개소리 해.
        - 난 하면 잘해. 그래, 그런데 안 하잖아. 세상에서 제일 쓸모없는 가정법이다.
        - 머리가 나쁜 것 같다고? 오늘 그 머리를 한 번도 안 썼으니 당연히 그렇게 느껴지지.
        - 이 문구 보고 기분만 좆같고 공부는 안 한다면, 내가 맞았다는 뜻이다. 꼬우면 한 문제 풀어서 증명해.
      correct:
        - 정답. 오 이 개새끼, 오늘은 사람 구실했네.
        - 맞았다. 존나 수상하지만 결과는 인정한다.
        - 정답. 병신 모드가 잠깐 꺼졌네. 귀한 장면이다.
        - 맞았다. 네가 맞으니까 내가 더 불안하다.
        - 정답. 오늘 뇌가 출근 도장은 찍었구나.
        - 맞았다. 개같이 못 믿겠지만 맞은 건 맞았다.
        - 정답. 야 등신아, 이렇게 할 줄 알면서 평소엔 왜 그 꼬라지냐.
        - 맞았다. 네 인생에도 가끔 이런 날이 오는구나.
        - 정답. 순간 다른 사람이 대신 한 줄 알았다.
        - 맞았다. 빡대가리 임시 해제다. 유효기간은 아직 모른다.
        - 정답. 오늘은 욕할 명분이 하나 줄었네. 아쉽다.
        - 맞았다. 씨발, 진짜 맞았네. 세상이 흉흉하다.
        - 정답. 개병신도 가끔 홈런을 친다더니.
        - 맞았다. 기적이라 하기엔 작고 네 실력이라 하기엔 수상하다.
        - 정답. 오늘만큼은 인간 취급해준다.
        - 맞았다. 염병, 웬일로 결과가 멀쩡하냐.
        - 정답. 너도 정상적인 결과를 낼 수는 있었구나.
        - 맞았다. 오늘 오답이 너 찾다가 길 잃었나 보다.
        - 정답. 이 정도면 대가리가 장식품은 아니었네.
        - 맞았다. 존나 의외라 칭찬보다 의심부터 든다.
        - 정답. 야 이 모지리야, 드디어 하나 해냈네.
        - 맞았다. 네 자존심 오늘 하루 연명 성공이다.
        - 정답. 씨발, 사람은 역시 오래 보고 볼 일이네.
        - 맞았다. 평소 행실 때문에 이것도 뽀록 같아 보인다.
        - 정답. 그래 이 새끼야. 가끔은 이렇게 멀쩡하게 살아.

        # 026-050
        - 맞았다. 오늘은 대가리에 우동사리 대신 뭔가 들어있네.
        - 정답. 너 때문에 기적의 기준이 존나 낮아졌다.
        - 맞았다. 결과가 멀쩡하니까 오히려 적응이 안 된다.
        - 정답. 개같이 의심했는데 네가 이겼다.
        - 맞았다. 야, 이건 진짜 잘했네. 짜증나게.
        - 정답. 네 뇌가 오늘 유료 버전인가 보다.
        - 정답. 이 새끼 갑자기 정상인 코스프레하네.
        - 맞았다. 계속 이러면 내가 널 잘못 봤다고 해야 하잖아.
        - 정답. 염병, 칭찬을 해줘야 하는 상황이 오네.
        - 맞았다. 오늘 네 인생 그래프에 양수 하나 찍혔다.
        - 정답. 대가리에서 드디어 오류 메시지가 안 떴네.
        - 맞았다. 잠깐이지만 지능이 연결됐다.
        - 정답. 네 안에 사람이 살고 있었구나.
        - 맞았다. 개판 칠 줄 알고 팝콘 들고 있었는데 실망이다.
        - 정답. 너한테 이런 결말도 가능했네.
        - 맞았다. 병신력 봉인 성공. 해제하지 마라.
        - 정답. 오늘은 내가 준비한 욕 절반이 재고로 남았다.
        - 맞았다. 시발, 내가 다 뿌듯하면 자존심 상하는데.
        - 정답. 네가 해놓고 네가 제일 놀랐을 것 같다.
        - 맞았다. 인간 포인트 1점 적립이다.
        - 정답. 100점 모으면 사람 신청 가능하다.
        - 맞았다. 평소보다 존나 덜 한심했다.
        - 정답. 오, 오늘은 폐기 보류다.
        - 맞았다. 네 인생 AS 기간 하루 연장해준다.

        # 051-075
        - 정답. 야 이 병신아, 이렇게 하면 되잖아.
        - 맞았다. 괜히 맨날 지랄한 게 아니었네.
        - 정답. 드디어 네 자신감에 근거가 하나 생겼다.
        - 맞았다. 항상 근거 없이 당당했는데 오늘은 예외다.
        - 정답. 웬일로 결과가 네 편을 들어주네.
        - 맞았다. 우주가 잠깐 너를 불쌍히 여긴 것 같다.
        - 정답. 좆나게 수상하지만 판정은 통과다.
        - 맞았다. 오늘은 오답란에서 결석 처리됐네.
        - 맞았다. 네가 맞는 걸 보니 시스템 점검할 뻔했다.
        - 정답. 오류인 줄 알았는데 정상 작동이었다.
        - 맞았다. 씨발, 갑자기 멀쩡해지면 캐릭터 무너지잖아.
        - 정답. 너답지 않게 잘했다.
        - 맞았다. 오늘 한정으로 빡대가리라는 말 취소한다.
        - 맞았다. 네 뇌세포 오늘 회식 취소하고 일했나 보다.
        - 정답. 몇 마리 안 남은 뇌세포들이 힘냈네.
        - 맞았다. 결과 하나로 집안 분위기 밝아질 정도다.
        - 정답. 부모님께 캡처해서 보내도 되겠다.
        - 정답. 네가 정상적인 결과를 내니까 묘하게 감동적이다.
        - 맞았다. 동물원 원숭이가 세금 신고한 느낌이다.

        - 유니폼은 입었는데 정신은 집에 두고 왔냐.
        - 코치가 작전 지시하다가 그냥 택시 불러주겠다.
        - 야 모지리야, 벤치에서도 이것보단 움직인다.
        - 네 행동력은 경기 기록에 0으로도 과분하다.
        - 존나 오래 침묵해서 주변 사람이 자기 인터넷부터 확인하겠다.
        - 네 반응 기다리다가 계절 하나 바뀔 것 같다.

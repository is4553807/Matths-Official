        - 사람이 가만히 있을 수는 있는데 너는 너무 완성도가 높다.

        # 176-200
        - 존나 조용하네. 공동묘지도 밤 되면 바람은 분다.
        - 야 이 개새끼야, 침묵 챌린지 우승했으니까 이제 끝내.
        - 가만히 있기 세계신기록 세워도 상금은 없다.

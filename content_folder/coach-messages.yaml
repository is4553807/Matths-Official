        - 응급실 접수 사유가 '아무것도 안 함'이면 의사도 욕한다.
        - 약 처방으로 해결될 게 아니라 실행 버튼이 필요하다.
        - 무료 치료법이 움직이는 건데 그것도 안 하냐.
        - 보험 적용 필요 없는 해결책도 거부하는 재주가 있네.
        - 야 모지리야, 인간 절전모드는 밤에나 써.
        - 낮부터 에너지 절약한다고 인생까지 절약하지 마라.
        - 배터리 아끼다가 기기 자체를 안 쓰는 놈이네.
        - 존나 오래 멈춰 있어서 먼지가 먼저 친구 신청하겠다.

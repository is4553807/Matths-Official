version: 1

# 상황 이름
# correct: 문제를 맞혔을 때
# incorrect: 문제를 틀렸을 때
# unanswered: 답을 제출하지 못했거나 힌트를 열었을 때
#
# 문구를 추가하거나 삭제하면 서버가 다음 요청에서 자동으로 다시 읽습니다.
# 각 목록에는 한 줄짜리 한국어 문구를 자유롭게 넣을 수 있습니다.

modes:
  mild:
    label: 순한맛
    title: 순한맛 모드
    messages:
      correct:
        - 잘 풀었어요. 핵심 조건을 정확히 읽었습니다.
        - 정답이에요. 지금 사용한 풀이 순서를 기억해두세요.
        - 좋아요. 계산과 개념 연결이 자연스러웠습니다.
        - 정확합니다. 같은 유형도 충분히 풀 수 있어요.
        - 잘했습니다. 중요한 단서를 놓치지 않았어요.
        - 정답입니다. 풀이가 한 단계 더 단단해졌어요.
        - 좋아요. 식을 세우는 방향이 정확했습니다.
        - 맞았습니다. 검산까지 하면 더 확실해져요.
        - 훌륭해요. 이 개념은 제대로 이해하고 있습니다.
        - 정답이에요. 다음 문제도 같은 원리로 접근해보세요.
      incorrect:
        - 괜찮아요. 첫 번째로 달라진 계산부터 다시 확인해봐요.
        - 아쉬워요. 문제의 조건을 식에 모두 옮겼는지 살펴보세요.
        - 한 번 더 볼까요? 부호와 계산 순서를 차례로 확인해요.
        - 거의 왔어요. 사용한 공식의 적용 조건을 다시 읽어보세요.
        - 틀린 지점이 배울 지점이에요. 첫 단서부터 천천히 이어가요.
        - 답보다 과정이 중요해요. 식을 세운 단계부터 점검해봐요.
        - 괜찮습니다. 주어진 값과 구해야 하는 값을 다시 나눠보세요.
        - 조금만 다듬으면 돼요. 중간 계산을 한 줄씩 검산해보세요.
        - 이번에는 놓쳤지만 원리를 확인하면 바로 고칠 수 있어요.
        - 다시 도전해봐요. 같은 유형의 핵심 조건부터 표시해보세요.
      unanswered:
        - 막혀도 괜찮아요. 문제에서 가장 먼저 주어진 조건을 찾아봐요.
        - 힌트를 보기 전에 구해야 하는 값을 한 문장으로 적어보세요.
        - 지금 아는 식 하나부터 써보면 다음 단계가 보일 거예요.
        - 문제를 작은 단계로 나누면 시작점을 찾기 쉬워요.
        - 서두르지 않아도 돼요. 개념 정의부터 문제에 연결해봐요.
        - 주어진 값과 모르는 값을 나누어 표시해보세요.
        - 첫 단서만 찾으면 됩니다. 나머지는 차례대로 이어가요.
        - 비슷한 예시에서 어떤 공식을 썼는지 떠올려보세요.
        - 식을 완성하지 못해도 괜찮아요. 아는 부분부터 적어봐요.
        - 그래프나 표로 바꾸어 보면 관계가 더 잘 보일 수 있어요.

  spicy:
    label: 매운맛
    title: 매운맛 모드
    messages:
      correct:
        - 정답. 이번에는 조건을 제대로 읽었네요.
        - 맞았습니다. 이 정도는 이제 실수 없이 끝냅시다.
        - 정답입니다. 풀이 속도까지 챙길 차례예요.
        - 좋아요. 같은 유형이 나오면 바로 식부터 세우세요.
        - 맞았습니다. 운이 아니라면 검산도 설명할 수 있어야 합니다.
        - 정답. 핵심을 잡았으니 다음 문제에서 다시 증명해보세요.
        - 정확합니다. 이제 계산 실수만 경계하면 됩니다.
        - 맞았어요. 풀이의 첫 단계를 확실히 기억하세요.
        - 정답입니다. 어려운 수치로 바뀌어도 같은 원리입니다.
        - 통과. 다음 문제에서는 더 빠르고 깔끔하게 풀어봅시다.
      incorrect:
        - 오답입니다. 감으로 고르지 말고 조건부터 식으로 옮기세요.
        - 틀렸습니다. 중간 계산을 생략한 지점부터 다시 보세요.
        - 공식은 맞아도 적용 조건이 틀리면 답은 틀립니다.
        - 오답. 부호 하나를 놓치면 전체 풀이가 무너집니다.
        - 문제를 끝까지 읽었는지부터 확인하세요.
        - 계산 탓으로 넘기지 말고 어느 단계에서 달라졌는지 찾으세요.
        - 틀렸습니다. 답을 바꾸기 전에 풀이 구조부터 고치세요.
        - 조건 하나가 빠졌습니다. 주어진 문장을 다시 식으로 만드세요.
        - 오답입니다. 검산했으면 잡을 수 있었던 실수예요.
        - 다시 풉시다. 같은 실수를 반복하지 않도록 원인을 적으세요.
      unanswered:
        - 멈춰 있지 말고 아는 조건 하나라도 식으로 쓰세요.
        - 못 풀겠다면 문제를 더 작은 단계로 쪼개세요.
        - 빈칸을 보고 있어도 답은 나오지 않습니다. 정의부터 적으세요.
        - 첫 줄을 쓰세요. 완벽한 풀이보다 시작이 먼저입니다.
        - 구해야 하는 값이 무엇인지부터 분명히 하세요.
        - 힌트는 답이 아닙니다. 다음 한 단계만 얻어가세요.
        - 문제의 숫자를 보기 전에 어떤 개념 문제인지 판단하세요.
        - 조건을 표시하고 사용할 공식을 하나 고르세요.
        - 막혔다면 계산이 아니라 풀이 방향부터 다시 잡으세요.
        - 포기하기 전에 그래프나 간단한 경우로 구조를 확인하세요.

  silent:
    label: 무음
    title: 무음 모드
    messages:
      correct:
        - 정답.
        - 정확합니다.
        - 풀이 완료.
        - 정답으로 기록했습니다.
        - 맞았습니다.
        - 계산이 정확합니다.
        - 조건을 충족했습니다.
        - 풀이가 일치합니다.
        - 검산 완료.
        - 다음 문제로 진행하세요.
      incorrect:
        - 오답.
        - 다시 확인하세요.
        - 계산이 일치하지 않습니다.
        - 조건을 다시 확인하세요.
        - 풀이를 점검하세요.
        - 부호를 확인하세요.
        - 공식을 다시 확인하세요.
        - 중간 과정을 검산하세요.
        - 오답으로 기록했습니다.
        - 같은 유형을 다시 풀어보세요.
      unanswered:
        - 답을 입력하세요.
        - 조건을 확인하세요.
        - 첫 단계를 적으세요.
        - 정의를 확인하세요.
        - 식을 세우세요.
        - 힌트를 확인하세요.
        - 주어진 값을 표시하세요.
        - 구할 값을 확인하세요.
        - 풀이를 시작하세요.
        - 개념을 다시 확인하세요.

        - 인사팀이 네 뇌에 경고장 보내야 한다.
        - 무응답이 업무 스타일이면 회사가 아니라 산속에 살아라.
        - 야 이 등신아, 최소한 '생각 중' 팻말이라도 목에 걸어.

        # 076-100
        - 뭐 하냐 이 모지리야. 묵비권 행사할 사건도 없는데.
        - 변호사 올 때까지 입 다물 생각이면 평생 기다려라.
        - 네 표정은 피의자인데 혐의는 그냥 멍때림이다.
        - 진술 거부한다고 상황이 유리해지는 구조가 아니다.
        - 침묵한다고 무죄가 되는 건 법정에서도 안 통한다.
        - 판사도 너 보면 답답해서 망치 대신 책상 치겠다.
        - 야 씨발, 범죄자도 신상 묻으면 이름은 댄다.
        - 묵비권을 이렇게 성실하게 쓰는 놈은 처음 본다.
        - 혐의명은 '시간 절도 및 뇌 방치'로 적당하다.
        - 현행범인데 도주도 안 하고 그냥 멍하니 있네.
        - 염병, 범인도 이것보단 행동력이 있다.
        - 조사관이 네 반응 기다리다 정년퇴직하겠다.
        - 진술서에 '피의자 계속 가만히 있음' 한 줄이면 끝이다.
        - 야 병신아, 사건 진행을 네가 막고 있잖아.
        - 네 침묵 때문에 수사팀만 야근하겠다.
        - 아무 범죄도 안 저질렀는데 피해자가 생겼다. 보는 사람이다.
        - 존나 답답해서 시간 절도죄로 신고하고 싶다.

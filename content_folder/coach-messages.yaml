        - 시작 버튼이 그렇게 어려우면 전자제품 쓰지 마라.
        - 화면만 본다고 자동 실행되는 기능은 없다 이 병신아.
        - 네 인생도 자동재생 지원 안 한다.
        - 대가리 블루투스가 연결 가능한 기기를 못 찾는 중이냐.

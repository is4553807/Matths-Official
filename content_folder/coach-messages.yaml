        - 면회 온 지능이 문 앞에서 돌아갔냐.
        - 네 뇌 전과는 모르겠고 출석률은 확실히 낮다.
        - 가석방 심사보다 네 반응 기다리는 게 더 오래 걸리겠다.
        - 판결은 간단하다. 피고인 존나 멍함.

        # 101-125
        - 야 병신아, 네 뇌 와이파이 안테나 어디 갔냐.
        - 비행기 모드 켜놓고 세상이랑 연결되길 바라냐.
        - 데이터 다 썼으면 와이파이라도 잡아 이 모지리야.
        - 공유기 옆에서 접속 실패하는 인간이 여기 있네.
        - 네 뇌만 인터넷에서 차단당한 것 같다.
        - IP 밴 먹을 만큼 머릿속에서 뭔 개지랄을 한 거냐.
        - 존나 재부팅이 필요한 표정인데 전원 버튼이 안 보인다.
        - 대가리 전원 코드부터 꽂혀 있는지 의심된다.
        - 야 등신아, 배터리 0%인 척 그만하고 충전 좀 해.
        - 네 뇌 배터리 성능이 12%면 서비스센터에서도 포기하겠다.

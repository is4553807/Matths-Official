        - 캐시만 존나 쌓이고 생각은 안 나오냐.
        - 오류 코드가 필요 없다. 화면에 네 얼굴만 띄우면 설명 끝이다.

        # 126-150
        - 염병, 왜 갑자기 인류 운명을 고민하는 철학자 표정이냐.

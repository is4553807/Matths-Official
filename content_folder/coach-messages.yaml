        - 야 모지리야, 그렇게 심오하게 얼어붙을 필요 없다.
        - 턱 괸다고 지능 스탯 올라가는 게임 아니다.
        - 미간 찌푸린다고 천재 필터 적용 안 된다.
        - 존나 고민하는 척은 하는데 사건이 하나도 안 일어난다.

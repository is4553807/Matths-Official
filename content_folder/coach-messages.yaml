        - 박수 타이밍은커녕 퇴장 타이밍도 놓쳤다.
        - 야 이 개새끼야, 조명팀도 너 기다리다 팔 빠지겠다.
        - 스포트라이트가 너한테 쓰이는 게 전기 낭비다.
        - 배경 소품이 너보다 서사가 많다.
        - 의자가 너보다 오늘 한 일이 많아 보인다.
        - 벽지는 최소한 벽이라도 꾸미고 있다.
        - 화분은 가만히 있어도 광합성은 한다 이 등신아.
        - 존나 움직임이 없어서 시간도 너를 건너뛰겠다.
        - 마네킹도 옷 판매에는 도움 된다.

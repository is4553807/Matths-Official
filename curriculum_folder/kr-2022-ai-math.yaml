              - 텍스트 벡터 사이 거리와 유사도를 2차원 공간에서 비교
      - id: image-data-processing
        title: 이미지 데이터 처리
        order: 3
        concepts:
          - id: ai-math-03-01
            order: 1
            title: 이미지의 행렬 표현
            standardCode: 12인수03-01
            achievementStandard: 행렬을 이용하여 이미지 데이터를 목적에 맞게 표현할 수 있다.
            topics:
              - 이미지의 행렬 표현
              - 수학적 표현과 해석
            scopeNotes:
              - 픽셀 위치와 RGB 정보를 행렬로 표현한다.
              - 행렬 연산을 이용한 이미지 변환에서 회전변환은 다루지 않는다.
            visualizationIdeas:
              - 이미지를 확대해 픽셀 RGB 행렬로 변환
              - 행렬값 변화가 밝기·대비·선명도에 미치는 효과를 실시간 비교
              - 두 이미지의 픽셀 차이가 해밍 거리로 누적되는 장면
          - id: ai-math-03-02
            order: 2
            title: 행렬을 이용한 이미지 변환
            standardCode: 12인수03-02
            achievementStandard: 행렬의 연산을 이용하여 이미지 데이터를 다양하게 변환할 수 있다.
            topics:
              - 행렬을 이용한 이미지 변환
              - 계산 방법과 절차
              - 수학적 표현과 해석
            scopeNotes:

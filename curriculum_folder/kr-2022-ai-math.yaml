              - 학습률에 따라 수렴·진동·발산하는 경사하강 경로 비교
          - id: ai-math-04-03
            order: 3
            title: 손실함수
            standardCode: 12인수04-03
            achievementStandard: 손실함수를 이해하고 최적화된 추세선을 찾을 수 있다.
            topics:
              - 손실함수
              - 핵심 의미와 원리
            scopeNotes:
              - 확률 계산은 상대도수를 활용하고 조건부확률 용어와 기호는 다루지 않는다.

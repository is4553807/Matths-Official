              - 두 이미지의 픽셀 차이가 해밍 거리로 누적되는 장면
          - id: ai-math-03-03
            order: 3
            title: 이미지 분류와 유사도
            standardCode: 12인수03-03
            achievementStandard: 인공지능이 이미지를 자동으로 분류하는 수학적 방법을 설명할 수 있다.
            topics:
              - 이미지 분류와 유사도
              - 핵심 의미와 원리
            scopeNotes:

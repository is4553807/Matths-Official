schemaVersion: 1
curriculum:
  id: kr-2022
  title: 2022 개정 교육과정
  country: KR
  source:
    title: 교육부 고시 제2022-33호 [별책 8] 수학과 교육과정
    type: official-curriculum
    url: https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0
grade:
  id: high-school-elective
  title: 고등학교 선택 과목
  recommendedGrades:
    - 11
    - 12
coursePlacementPolicy:
  type: school-defined
  description: >-
    2022 개정 교육과정의 선택 과목은 특정 학년에 고정되지 않는다. recommendedGrades는 Matths의 기본 안내이며 실제 개설 학년과 학기는 학교 교육과정에
    따라 달라질 수 있다.
editorialPolicy:
  achievementStandards: 교육부 고시의 성취기준을 원문 기준으로 구조화했다.
  topics: topics는 성취기준을 Matths 학습 화면에 맞게 나눈 편집 단위다.
  visualizationIdeas: visualizationIdeas는 공식 교육과정의 공학 도구 활용 취지를 반영한 Matths 편집 제안이다.
courses:
  - id: ai-math
    officialTitle: 인공지능 수학
    category: career-elective
    categoryTitle: 진로 선택
    recommendedGrades:
      - 11
      - 12
    prerequisites:
      - common-math-1
      - common-math-2
    defaultSemester: school-defined
    conceptCount: 15
    units:
      - id: ai-and-big-data
        title: 인공지능과 빅데이터
        order: 1
        concepts:
          - id: ai-math-01-01
            order: 1
            title: 인공지능의 학습 방식
            standardCode: 12인수01-01
            achievementStandard: 인공지능의 개념을 이해하고 학습 방식을 수학적으로 해석할 수 있다.
            topics:
              - 인공지능의 학습 방식
              - 핵심 의미와 원리
            scopeNotes:
              - 지도학습·비지도학습·강화학습과 퍼셉트론은 개념 중심으로 다룬다.
              - 빅데이터 활용에서 편향과 공정성을 함께 고려한다.
            visualizationIdeas:
              - 퍼셉트론의 입력·가중치·활성화 결과가 흐르는 네트워크 애니메이션
              - OR·AND·XOR의 결정 영역과 단층·다층 구조 비교
              - 데이터 표본의 편향이 예측 결과의 편향으로 이어지는 시뮬레이션
          - id: ai-math-01-02
            order: 2
            title: 인공지능과 수학의 역사
            standardCode: 12인수01-02
            achievementStandard: 인공지능에서 수학을 활용한 역사적 사례를 탐구하고 설명할 수 있다.
            topics:
              - 인공지능과 수학의 역사
              - 핵심 의미와 원리
              - 적용과 문제 해결
              - 탐구 설계와 수행
            scopeNotes:
              - 지도학습·비지도학습·강화학습과 퍼셉트론은 개념 중심으로 다룬다.
              - 빅데이터 활용에서 편향과 공정성을 함께 고려한다.
            visualizationIdeas:
              - 퍼셉트론의 입력·가중치·활성화 결과가 흐르는 네트워크 애니메이션
              - OR·AND·XOR의 결정 영역과 단층·다층 구조 비교
              - 데이터 표본의 편향이 예측 결과의 편향으로 이어지는 시뮬레이션
          - id: ai-math-01-03
            order: 3
            title: 빅데이터와 인공지능
            standardCode: 12인수01-03
            achievementStandard: 빅데이터의 개념과 특성을 알고 인공지능에서 빅데이터를 활용한 사례를 찾을 수 있다.
            topics:
              - 빅데이터와 인공지능
              - 핵심 의미와 원리
              - 적용과 문제 해결
            scopeNotes:
              - 지도학습·비지도학습·강화학습과 퍼셉트론은 개념 중심으로 다룬다.
              - 빅데이터 활용에서 편향과 공정성을 함께 고려한다.
            visualizationIdeas:
              - 퍼셉트론의 입력·가중치·활성화 결과가 흐르는 네트워크 애니메이션
              - OR·AND·XOR의 결정 영역과 단층·다층 구조 비교
              - 데이터 표본의 편향이 예측 결과의 편향으로 이어지는 시뮬레이션
      - id: text-data-processing
        title: 텍스트 데이터 처리
        order: 2
        concepts:
          - id: ai-math-02-01
            order: 1
            title: 텍스트의 집합·벡터 표현
            standardCode: 12인수02-01
            achievementStandard: 집합과 벡터를 이용하여 텍스트 데이터를 목적에 맞게 표현할 수 있다.
            topics:
              - 텍스트의 집합·벡터 표현
              - 수학적 표현과 해석
            scopeNotes:
              - 수학 이론 자체보다 인공지능에서의 활용을 중심으로 다룬다.
              - 코사인 유사도에서 내적 관련 용어와 기호는 사용하지 않는다.
              - 대수 이수자는 로그를 이용한 역문서빈도 표현을 선택적으로 다룰 수 있다.
            visualizationIdeas:
              - 문장이 단어 집합과 빈도 벡터로 변환되는 토큰 애니메이션
              - 문서빈도에 따라 단어의 TF-IDF 가중치가 변하는 막대그래프
              - 텍스트 벡터 사이 거리와 유사도를 2차원 공간에서 비교
          - id: ai-math-02-02
            order: 2
            title: 단어가방과 TF-IDF
            standardCode: 12인수02-02
            achievementStandard: 빈도수 벡터를 이용하여 텍스트 데이터를 요약하고 유용한 정보를 추출할 수 있다.
            topics:
              - 단어가방과 TF-IDF
              - 수학적 표현과 해석
            scopeNotes:
              - 수학 이론 자체보다 인공지능에서의 활용을 중심으로 다룬다.
              - 코사인 유사도에서 내적 관련 용어와 기호는 사용하지 않는다.
              - 대수 이수자는 로그를 이용한 역문서빈도 표현을 선택적으로 다룰 수 있다.
            visualizationIdeas:
              - 문장이 단어 집합과 빈도 벡터로 변환되는 토큰 애니메이션
              - 문서빈도에 따라 단어의 TF-IDF 가중치가 변하는 막대그래프
              - 텍스트 벡터 사이 거리와 유사도를 2차원 공간에서 비교
          - id: ai-math-02-03
            order: 3
            title: 텍스트 유사도와 감성 분석
            standardCode: 12인수02-03
            achievementStandard: 인공지능이 텍스트를 특성에 따라 분석하는 수학적 방법을 설명할 수 있다.
            topics:
              - 텍스트 유사도와 감성 분석
              - 핵심 의미와 원리
              - 탐구 설계와 수행
            scopeNotes:
              - 수학 이론 자체보다 인공지능에서의 활용을 중심으로 다룬다.

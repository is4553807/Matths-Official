      - id: prediction-and-optimization
        title: 예측과 최적화
        order: 4
        concepts:
          - id: ai-math-04-01
            order: 1
            title: 데이터와 확률 예측
            standardCode: 12인수04-01
            achievementStandard: 데이터를 분석하여 사건이 일어날 확률을 구하고 이를 예측에 이용할 수 있다.
            topics:
              - 데이터와 확률 예측
              - 적용과 문제 해결
              - 탐구 설계와 수행
            scopeNotes:
              - 확률 계산은 상대도수를 활용하고 조건부확률 용어와 기호는 다루지 않는다.
              - 손실함수는 일변수함수로 정의된 간단한 경우를 다룬다.
              - 극한과 미분계수는 경사하강법 이해에 필요한 직관적 수준으로 다룬다.
            visualizationIdeas:
              - 여러 추세선의 잔차를 선분으로 표시하고 손실값 비교
              - 손실함수 곡면 위 점이 기울기 반대 방향으로 최솟값에 이동
              - 학습률에 따라 수렴·진동·발산하는 경사하강 경로 비교

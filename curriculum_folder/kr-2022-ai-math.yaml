      - id: ai-math-inquiry
        title: 인공지능과 수학 탐구
        order: 5
        concepts:
          - id: ai-math-05-01
            order: 1
            title: 인공지능의 합리적 의사 결정
            standardCode: 12인수05-01
            achievementStandard: 수학적 원리를 이용하여 인공지능이 실생활 문제를 합리적으로 해결하는 사례를 찾을 수 있다.
            topics:
              - 인공지능의 합리적 의사 결정
              - 적용과 문제 해결
            scopeNotes:
              - 인공지능 의사 결정의 효율성과 함께 윤리성과 공정성을 판단한다.
              - 환경·생태·지속가능발전과 관련된 탐구를 수행할 수 있다.
            visualizationIdeas:
              - 같은 데이터에서 목표함수에 따라 다른 의사 결정이 나오는 비교
              - 탐구 질문→데이터→수학적 모델→결론의 프로젝트 흐름도
          - id: ai-math-05-02
            order: 2
            title: 인공지능 수학 주제 탐구
            standardCode: 12인수05-02
            achievementStandard: 인공지능과 관련된 수학 주제를 선정하여 탐구할 수 있다.
            topics:
              - 인공지능 수학 주제 탐구
              - 계산 방법과 절차
              - 탐구 설계와 수행
            scopeNotes:
              - 인공지능 의사 결정의 효율성과 함께 윤리성과 공정성을 판단한다.
              - 환경·생태·지속가능발전과 관련된 탐구를 수행할 수 있다.
            visualizationIdeas:
              - 같은 데이터에서 목표함수에 따라 다른 의사 결정이 나오는 비교
              - 탐구 질문→데이터→수학적 모델→결론의 프로젝트 흐름도

          - id: ai-math-04-04
            order: 4
            title: 경사하강법
            standardCode: 12인수04-04
            achievementStandard: 경사하강법을 이해하고 최적화된 예측을 위한 인공지능의 학습 방법을 설명할 수 있다.
            topics:

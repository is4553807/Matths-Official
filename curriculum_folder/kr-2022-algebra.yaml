coursePlacementPolicy:
  type: school-defined
  description: >-
    2022 개정 교육과정의 선택 과목은 특정 학년에 고정되지 않는다. recommendedGrades는 Matths의 기본 안내이며 실제 개설 학년과 학기는 학교 교육과정에
    따라 달라질 수 있다.
editorialPolicy:
  achievementStandards: 교육부 고시의 성취기준을 원문 기준으로 구조화했다.
  topics: topics는 성취기준을 Matths 학습 화면에 맞게 나눈 편집 단위다.
  visualizationIdeas: visualizationIdeas는 공식 교육과정의 공학 도구 활용 취지를 반영한 Matths 편집 제안이다.

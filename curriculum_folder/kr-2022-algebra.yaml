      - id: trigonometric-functions
        title: 삼각함수
        order: 2
        concepts:
          - id: algebra-02-01
            order: 1
            title: 일반각과 호도법
            standardCode: 12대수02-01
            achievementStandard: 일반각과 호도법의 뜻을 알고, 그 관계를 설명할 수 있다.
            topics:
              - 일반각과 호도법
              - 핵심 의미와 원리
            scopeNotes:
              - 삼각함수는 중학교의 삼각비와 연결하여 이해한다.
              - 삼각방정식과 부등식은 그래프 해석에 필요한 간단한 경우만 다룬다.
              - 그래프의 기본 성질 이해에 중점을 두고 지나치게 복잡한 문제는 다루지 않는다.
            visualizationIdeas:
              - 단위원 위 점의 회전과 사인·코사인·탄젠트 그래프를 동기화
              - 각도를 도와 라디안으로 동시에 표시하며 호의 길이를 비교
              - 삼각형의 변과 각을 움직이며 사인법칙·코사인법칙의 불변 관계 표시

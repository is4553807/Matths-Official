          - id: algebra-01-01
            order: 1
            title: 거듭제곱과 거듭제곱근
            standardCode: 12대수01-01
            achievementStandard: 거듭제곱과 거듭제곱근의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다.
            topics:
              - 거듭제곱과 거듭제곱근
              - 핵심 의미와 원리
              - 계산 방법과 절차
            scopeNotes:
              - 실수 지수는 밑이 양수인 경우에 한하여 직관적으로 다룬다.
              - 지수함수와 로그함수는 역함수 관계를 그래프로 확인한다.
              - 지나치게 복잡한 계산을 포함하는 문제는 다루지 않는다.
            visualizationIdeas:
              - 지수가 정수에서 유리수와 실수로 촘촘하게 확장되는 수직선 애니메이션
              - 지수함수와 로그함수가 y=x에 대해 대칭이 되는 역함수 변환
              - 복리·성장·감쇠 자료를 로그 눈금과 일반 눈금으로 비교하는 인터랙션

            standardCode: 12미적Ⅰ-02-01
            achievementStandard: 미분계수를 이해하고, 이를 구할 수 있다.
            topics:
              - 미분계수
              - 핵심 의미와 원리
              - 계산 방법과 절차
            scopeNotes:
              - 미분계수는 평균변화율의 극한과 접선의 기울기를 연결하여 다룬다.
              - 속도와 가속도 문제는 직선 운동에 한하여 다룬다.
              - 지나치게 복잡한 도함수 계산은 다루지 않는다.
            visualizationIdeas:
              - 두 점을 잇는 할선이 한 점의 접선으로 수렴하는 애니메이션
              - 도함수 부호와 원함수의 증가·감소 구간을 색으로 연결
              - 위치·속도·가속도 그래프를 같은 시간축에 동기화

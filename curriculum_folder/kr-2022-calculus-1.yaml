        order: 1
        concepts:
          - id: calculus-1-01-01
            order: 1
            title: 함수의 극한
            standardCode: 12미적Ⅰ-01-01
            achievementStandard: 함수의 극한의 뜻을 알고, 이를 설명할 수 있다.
            topics:
              - 함수의 극한
              - 핵심 의미와 원리
            scopeNotes:
              - 극한과 연속의 뜻과 성질은 그래프를 통해 직관적으로 이해한다.
              - 복잡한 합성함수나 절댓값이 여러 개 포함된 함수는 다루지 않는다.
            visualizationIdeas:
              - 점이 좌우에서 한 점에 접근할 때 함수값과 극한값을 동시 표시
              - 그래프의 끊김·점프·구멍을 움직이며 연속 조건을 비교
              - 사잇값 정리를 움직이는 수평선과 교점으로 표현

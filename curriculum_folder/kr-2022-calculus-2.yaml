            order: 1
            title: 수열의 수렴과 발산
            standardCode: 12미적Ⅱ-01-01
            achievementStandard: 수열의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다.
            topics:
              - 수열의 수렴과 발산
              - 핵심 의미와 원리
            scopeNotes:
              - 수열과 급수의 수렴·발산을 공학 도구로 탐구할 수 있다.
              - 지나치게 복잡한 급수 계산은 다루지 않는다.
            visualizationIdeas:
              - 수열의 항을 수직선과 좌표평면에 동시에 찍어 수렴·발산 비교
              - 부분합 막대가 일정한 값에 가까워지거나 벗어나는 과정 표현
              - 무한등비급수를 반복적으로 축소되는 넓이 조각으로 재구성

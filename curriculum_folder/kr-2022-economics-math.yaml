      - id: numbers-and-economics
        title: 수와 경제
        order: 1
        concepts:
          - id: economics-math-01-01
            order: 1
            title: 경제지표
            standardCode: 12경수01-01
            achievementStandard: 통계 자료를 활용하여 경제지표의 의미를 이해하고, 경제지표의 변화를 설명할 수 있다.
            topics:
              - 경제지표
              - 핵심 의미와 원리
              - 수학적 표현과 해석
              - 적용과 문제 해결
            scopeNotes:
              - 공식 암기보다 경제 상황에 맞는 수학적 개념과 표현의 선택에 중점을 둔다.
              - 경제지표·환율·세금·금융상품은 학생 삶과 연결된 구체적 사례로 다룬다.
              - 미적분Ⅱ 이수자에게는 연속복리를 선택적으로 다룰 수 있다.
            visualizationIdeas:
              - 물가·환율 지표의 기준 시점과 변화율을 시간축에서 비교
              - 단리·복리·연속복리의 원리합계 곡선을 같은 축에 중첩
              - 미래 현금 흐름을 현재 시점으로 할인해 이동시키는 애니메이션

    officialTitle: 경제 수학
    category: career-elective
    categoryTitle: 진로 선택
    recommendedGrades:
      - 11
      - 12
    prerequisites:
      - common-math-1
      - common-math-2
    defaultSemester: school-defined
    conceptCount: 18

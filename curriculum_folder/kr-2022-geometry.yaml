              - 포물선
              - 핵심 의미와 원리
              - 수학적 표현과 해석
            scopeNotes:
              - 이차곡선은 정의와 방정식을 초점·준선·거리 관계와 연결한다.
              - 이차곡선의 접선은 이차방정식의 판별식을 이용하여 구한다.
            visualizationIdeas:
              - 원뿔 절단 각도에 따라 원·타원·포물선·쌍곡선이 나타나는 3차원 애니메이션

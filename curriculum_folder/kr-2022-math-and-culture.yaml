            order: 1
            title: 음악과 수학
            standardCode: 12수문01-01
            achievementStandard: 음악과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다.
            topics:
              - 음악과 수학
              - 탐구 설계와 수행
            scopeNotes:
              - 예술 속 수학의 아름다움과 유용성을 탐구하고 창작 활동으로 연결한다.
              - 자료와 작품을 활용할 때 출처를 명확히 밝힌다.
            visualizationIdeas:
              - 현의 길이 비와 음정이 파형·주파수로 연결되는 애니메이션
              - 원근법·황금비·쪽매맞춤을 작품 위 가이드로 중첩
              - 문학·영상의 수학적 구조를 장면 지도와 패턴으로 표현

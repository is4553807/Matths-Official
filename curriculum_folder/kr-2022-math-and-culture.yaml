            achievementStandard: 민속 수학과 건축 양식 속에 나타난 수학적 원리에 대해 탐구하고 문화 다양성을 이해한다.
            topics:
              - 민속·건축과 수학
              - 핵심 의미와 원리
              - 탐구 설계와 수행
            scopeNotes:
              - 문화 다양성과 사회적 소수자를 배려하는 공동체 관점을 포함한다.
              - 데이터 해석과 소비 의사 결정에서 다양한 가치와 관점을 비교한다.
            visualizationIdeas:
              - 문화권별 달력·건축 패턴의 수 체계와 대칭 비교
              - 점자 배열을 이진 패턴과 진법으로 변환
              - 대중매체 데이터가 워드클라우드와 빈도 그래프로 변하는 과정

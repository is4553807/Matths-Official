schemaVersion: 1
curriculum:
  id: kr-2022
  title: 2022 개정 교육과정
  country: KR
  source:
    title: 교육부 고시 제2022-33호 [별책 8] 수학과 교육과정
    type: official-curriculum
    url: https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0
grade:
  id: high-school-elective
  title: 고등학교 선택 과목
  recommendedGrades:
    - 11
    - 12
coursePlacementPolicy:
  type: school-defined
  description: >-
    2022 개정 교육과정의 선택 과목은 특정 학년에 고정되지 않는다. recommendedGrades는 Matths의 기본 안내이며 실제 개설 학년과 학기는 학교 교육과정에
    따라 달라질 수 있다.
editorialPolicy:
  achievementStandards: 교육부 고시의 성취기준을 원문 기준으로 구조화했다.
  topics: topics는 성취기준을 Matths 학습 화면에 맞게 나눈 편집 단위다.
  visualizationIdeas: visualizationIdeas는 공식 교육과정의 공학 도구 활용 취지를 반영한 Matths 편집 제안이다.
courses:
  - id: math-research-project
    officialTitle: 수학과제 탐구
    category: convergence-elective
    categoryTitle: 융합 선택
    recommendedGrades:
      - 11
      - 12
    prerequisites: []
    defaultSemester: school-defined
    conceptCount: 10
    units:
      - id: understanding-math-inquiry
        title: 과제 탐구의 이해
        order: 1
        concepts:
          - id: math-research-project-01-01
            order: 1
            title: 수학과제 탐구의 의미와 필요성
            standardCode: 12수과01-01
            achievementStandard: 수학과제 탐구의 의미와 필요성을 설명할 수 있다.
            topics:
              - 수학과제 탐구의 의미와 필요성
              - 핵심 의미와 원리
              - 탐구 설계와 수행
            scopeNotes:
              - 학생 수준에 맞는 현실적 탐구를 안내하고 과도한 심화는 지양한다.
              - 표절·조작 방지, 출처 표기, 생명윤리와 안전을 탐구 전 과정에서 준수한다.
            visualizationIdeas:
              - 일상 질문이 수학적 탐구 문제로 구체화되는 단계별 흐름
              - 올바른 인용·표절·자료 조작 사례를 비교하는 의사 결정 시나리오
          - id: math-research-project-01-02
            order: 2
            title: 연구 윤리
            standardCode: 12수과01-02
            achievementStandard: 올바른 연구 윤리를 이해하고, 탐구의 전 과정에서 이를 준수한다.
            topics:
              - 연구 윤리
              - 핵심 의미와 원리
              - 탐구 설계와 수행
            scopeNotes:
              - 학생 수준에 맞는 현실적 탐구를 안내하고 과도한 심화는 지양한다.
              - 표절·조작 방지, 출처 표기, 생명윤리와 안전을 탐구 전 과정에서 준수한다.
            visualizationIdeas:
              - 일상 질문이 수학적 탐구 문제로 구체화되는 단계별 흐름
              - 올바른 인용·표절·자료 조작 사례를 비교하는 의사 결정 시나리오
      - id: inquiry-methods-and-procedures
        title: 과제 탐구의 방법과 절차
        order: 2
        concepts:
          - id: math-research-project-02-01
            order: 1
            title: 문헌 조사
            standardCode: 12수과02-01
            achievementStandard: 문헌 조사를 통해 탐구하는 방법과 절차를 이해하고 설명할 수 있다.
            topics:
              - 문헌 조사
              - 핵심 의미와 원리
              - 탐구 설계와 수행
            scopeNotes:
              - 탐구 주제에 따라 문헌 조사·사례 조사·수학 실험·개발 연구 중 적절한 방법을 선택한다.
              - 자료를 허위로 만들거나 임의로 조작하지 않는다.
            visualizationIdeas:
              - 네 가지 탐구 방법의 입력 자료·절차·산출물을 비교하는 흐름도
              - 수학적 모델링의 현실 문제→수학 문제→해결→현실 해석 순환 애니메이션
              - 퍼즐·게임·공학 도구 산출물의 설계와 반복 개선 과정
          - id: math-research-project-02-02

              - 퍼즐·게임·공학 도구 산출물의 설계와 반복 개선 과정
      - id: inquiry-execution-and-evaluation
        title: 과제 탐구의 실행 및 평가
        order: 3
        concepts:
          - id: math-research-project-03-01
            order: 1
            title: 탐구 주제와 계획
            standardCode: 12수과03-01
            achievementStandard: 여러 가지 현상에서 수학 탐구 주제를 선정하고 탐구 계획을 수립할 수 있다.
            topics:
              - 탐구 주제와 계획
              - 탐구 설계와 수행
            scopeNotes:
              - 탐구 문제의 명확성·가치·실행 가능성을 고려해 계획을 수립한다.
              - 과정 중간 점검과 수정, 역할 분담, 자료 기반 의사 결정을 포함한다.
              - 탐구 목적과 방법의 적합성을 자기·동료 평가로 성찰한다.
            visualizationIdeas:
              - 주제 후보를 가치·실행 가능성·시간 기준으로 평가하는 매트릭스
              - 계획→수행→중간 점검→수정→결론의 프로젝트 타임라인
              - 탐구 산출물의 근거·표현·한계점을 루브릭으로 시각화

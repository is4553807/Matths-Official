      - id: data-analysis
        title: 자료의 분석
        order: 3
        concepts:
          - id: practical-statistics-03-01
            order: 1
            title: 정규분포와 t분포
            standardCode: 12실통03-01
            achievementStandard: 정규분포와 t 분포를 공학 도구를 이용하여 탐구할 수 있다.
            topics:
              - 정규분포와 t분포
              - 계산 방법과 절차
              - 탐구 설계와 수행
            scopeNotes:
              - 이론 전개보다 공학 도구를 이용한 통계적 추론과 결과 해석에 중점을 둔다.
              - 가설과 유의수준, p값의 의미를 실제 사례와 연결한다.
            visualizationIdeas:
              - 표본 크기에 따라 정규분포와 t분포 곡선이 가까워지는 애니메이션
              - 표본을 반복 추출하며 신뢰구간이 모수를 포함하는 빈도 시뮬레이션
              - 귀무가설 분포에서 관측값과 p값 영역을 색으로 표시

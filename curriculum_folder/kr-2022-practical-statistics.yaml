      - id: data-collection-and-organization
        title: 자료의 수집과 정리
        order: 2
        concepts:
          - id: practical-statistics-02-01
            order: 1
            title: 자료의 종류와 척도
            standardCode: 12실통02-01
            achievementStandard: 자료의 종류를 알고 설명할 수 있다.
            topics:
              - 자료의 종류와 척도
              - 핵심 의미와 원리
            scopeNotes:
              - 계산이나 그래프 작성 자체보다 결과 해석에 중점을 둔다.
              - 자료 수집과 시각화 과정에서 오류와 편향을 비판적으로 검토한다.
            visualizationIdeas:
              - 범주형·수치형 자료와 네 가지 척도를 카드 분류 방식으로 비교
              - 동일 자료를 여러 그래프로 바꾸며 적합성과 왜곡 가능성 비교
              - 자료점 이동에 따라 평균·중앙값·표준편차가 변하는 인터랙션

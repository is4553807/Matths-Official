            order: 3
            title: 모집단·표본과 표본추출
            standardCode: 12실통01-03
            achievementStandard: 모집단과 표본의 뜻을 알고, 표본추출의 방법을 이해하여 문제 상황에 맞는 방법을 선택할 수 있다.
            topics:

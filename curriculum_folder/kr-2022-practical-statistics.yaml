      - id: statistical-inquiry
        title: 통계적 탐구
        order: 4
        concepts:
          - id: practical-statistics-04-01
            order: 1
            title: 통계적 탐구와 의사 결정
            standardCode: 12실통04-01
            achievementStandard: 실생활에서 통계적 탐구 과정에 따라 문제를 해결하고 합리적인 의사 결정을 할 수 있다.
            topics:
              - 통계적 탐구와 의사 결정
              - 적용과 문제 해결
              - 탐구 설계와 수행
            scopeNotes:
              - 표본 조사 설계, 자료 수집, 분석, 결론 도출의 전 과정에서 연구 윤리를 준수한다.
              - 탐구 목적과 통계 방법의 적합성을 비판적으로 성찰한다.
            visualizationIdeas:
              - 탐구 질문→조사 설계→자료→분석→결론을 하나의 대시보드 흐름으로 표현
              - 표본·그래프·분석 방법 선택이 결론에 미치는 영향을 비교

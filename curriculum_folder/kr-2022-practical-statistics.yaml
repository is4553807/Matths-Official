coursePlacementPolicy:
  type: school-defined
  description: >-
    2022 개정 교육과정의 선택 과목은 특정 학년에 고정되지 않는다. recommendedGrades는 Matths의 기본 안내이며 실제 개설 학년과 학기는 학교 교육과정에
    따라 달라질 수 있다.
editorialPolicy:
  achievementStandards: 교육부 고시의 성취기준을 원문 기준으로 구조화했다.
  topics: topics는 성취기준을 Matths 학습 화면에 맞게 나눈 편집 단위다.
  visualizationIdeas: visualizationIdeas는 공식 교육과정의 공학 도구 활용 취지를 반영한 Matths 편집 제안이다.
courses:
  - id: practical-statistics
    officialTitle: 실용 통계
    category: convergence-elective
    categoryTitle: 융합 선택
    recommendedGrades:
      - 11
      - 12
    prerequisites:
      - common-math-1
      - common-math-2
    defaultSemester: school-defined
    conceptCount: 13
    units:
      - id: statistics-and-statistical-problems
        title: 통계와 통계적 문제
        order: 1
        concepts:
          - id: practical-statistics-01-01
            order: 1
            title: 통계의 유용성과 필요성
            standardCode: 12실통01-01
            achievementStandard: 통계와 통계적 방법의 유용성과 필요성을 인식할 수 있다.
            topics:
              - 통계의 유용성과 필요성
              - 핵심 관계
            scopeNotes:
              - 불확실성과 변이성을 고려해 통계적으로 해결 가능한 문제를 구분한다.
              - 전수조사와 표본조사, 대표적인 확률표출 방법을 사례 중심으로 다룬다.
            visualizationIdeas:
              - 같은 현상에서 반복 측정값이 흩어지는 변이성 시뮬레이션
              - 모집단에서 서로 다른 방법으로 표본을 뽑아 편향 비교
              - 문제 설정부터 결론까지 통계적 문제 해결 순환 과정 표현
          - id: practical-statistics-01-02
            order: 2
            title: 통계적 문제 해결 과정
            standardCode: 12실통01-02
            achievementStandard: 통계적 문제해결 과정을 이해하고 각 단계의 역할을 설명할 수 있다.
            topics:
              - 통계적 문제 해결 과정
              - 핵심 의미와 원리
              - 적용과 문제 해결
            scopeNotes:
              - 불확실성과 변이성을 고려해 통계적으로 해결 가능한 문제를 구분한다.
              - 전수조사와 표본조사, 대표적인 확률표출 방법을 사례 중심으로 다룬다.
            visualizationIdeas:
              - 같은 현상에서 반복 측정값이 흩어지는 변이성 시뮬레이션

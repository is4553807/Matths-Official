              - 핵심 의미와 원리
            scopeNotes:
              - 이항분포 평균과 분산 공식을 증명하는 문제는 다루지 않는다.
              - 모평균 추정은 모집단이 정규분포인 경우, 모비율 추정은 표본 크기가 큰 경우를 다룬다.
              - 복잡한 신뢰구간 계산보다 결과의 의미와 해석에 중점을 둔다.
            visualizationIdeas:
              - 확률질량이 막대 높이로 배치되고 기댓값이 무게중심으로 이동

            title: 중복순열과 같은 것이 있는 순열
            standardCode: 12확통01-01
            achievementStandard: 중복순열, 같은 것이 있는 순열을 이해하고, 그 순열의 수를 구하는 방법을 설명할 수 있다.
            topics:
              - 중복순열과 같은 것이 있는 순열
              - 핵심 의미와 원리
            scopeNotes:
              - 공통수학1의 경우의 수와 연결되는 내용은 필요한 경우 간단히 다룬다.
              - 항이 세 개 이상인 다항정리와 허수단위가 포함된 이항정리는 다루지 않는다.
            visualizationIdeas:
              - 선택 과정을 가지로 펼쳐 중복 허용 여부에 따른 경우의 수 비교
              - 같은 대상의 자리 교환을 접어 중복 제거 과정을 표현
              - 파스칼의 삼각형과 이항계수가 동시에 생성되는 애니메이션

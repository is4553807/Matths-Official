schemaVersion: 1
curriculum:
  id: kr-2022
  title: 2022 개정 교육과정
  country: KR
  source:
    title: 교육부 고시 제2022-33호 [별책 8] 수학과 교육과정
    type: official-curriculum
    url: https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=141&boardSeq=93458&lev=0
grade:
  id: high-school-elective
  title: 고등학교 선택 과목
  recommendedGrades:
    - 11
    - 12
coursePlacementPolicy:
  type: school-defined
  description: >-
    2022 개정 교육과정의 선택 과목은 특정 학년에 고정되지 않는다. recommendedGrades는 Matths의 기본 안내이며 실제 개설 학년과 학기는 학교 교육과정에
    따라 달라질 수 있다.
editorialPolicy:
  achievementStandards: 교육부 고시의 성취기준을 원문 기준으로 구조화했다.
  topics: topics는 성취기준을 Matths 학습 화면에 맞게 나눈 편집 단위다.
  visualizationIdeas: visualizationIdeas는 공식 교육과정의 공학 도구 활용 취지를 반영한 Matths 편집 제안이다.
courses:
  - id: vocational-math
    officialTitle: 직무 수학
    category: career-elective
    categoryTitle: 진로 선택
    recommendedGrades:
      - 11
      - 12
    prerequisites: []
    defaultSemester: school-defined
    conceptCount: 18
    units:
      - id: numbers-and-operations
        title: 수와 연산
        order: 1
        concepts:
          - id: vocational-math-01-01
            order: 1
            title: 직무와 사칙연산
            standardCode: 12직수01-01
            achievementStandard: 직무 상황에서 수 개념과 사칙연산의 문제를 해결하고 그 유용성을 인식할 수 있다.
            topics:
              - 직무와 사칙연산
              - 핵심 의미와 원리
              - 계산 방법과 절차
              - 적용과 문제 해결
            scopeNotes:
              - 직무 상황의 실제 문제 해결에 중점을 두고 필요한 경우 공학 도구를 사용한다.
              - 국제단위계 외 단위와 국가 간 시차를 실제 자료와 연결할 수 있다.
            visualizationIdeas:
              - 예산·비용 항목이 사칙연산으로 합쳐지는 직무 영수증 시뮬레이션
              - 올림·버림·반올림에 따른 견적 차이 비교
              - 단위 블록의 크기가 환산 비율에 따라 바뀌는 애니메이션
          - id: vocational-math-01-02
            order: 2
            title: 큰 수와 어림
            standardCode: 12직수01-02
            achievementStandard: 큰 수를 어림하여 문제를 해결하고, 어림값을 이용하여 수의 크기를 비교할 수 있다.
            topics:
              - 큰 수와 어림
              - 적용과 문제 해결
            scopeNotes:
              - 직무 상황의 실제 문제 해결에 중점을 두고 필요한 경우 공학 도구를 사용한다.

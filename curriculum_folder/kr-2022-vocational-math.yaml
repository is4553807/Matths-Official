        title: 도형과 측정
        order: 3
        concepts:
          - id: vocational-math-03-01
            order: 1
            title: 겨냥도와 전개도
            standardCode: 12직수03-01
            achievementStandard: 입체도형의 겨냥도와 전개도를 그릴 수 있고, 이를 이용하여 입체도형의 모양을 만들 수 있다.
            topics:
              - 겨냥도와 전개도
              - 핵심 관계
            scopeNotes:
              - 도형의 이동·합동·닮음은 제품 설계와 배치 등 직무 상황에 적용한다.
              - 겉넓이와 부피는 포장·보관·운송 상황과 연결한다.
            visualizationIdeas:
              - 상자를 펼쳐 전개도로 만들고 다시 접는 3차원 애니메이션
              - 물체를 회전하며 위·앞·옆 모습과 동기화
              - 포장재 크기와 용량을 바꾸며 겉넓이·부피의 변화 비교
